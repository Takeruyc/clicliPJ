<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户注册</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="page-pink">
    <div class="back" id="top">
        <div id="siteName">
            <a href="/" th:href="@{/}">
                <img src="/uploads/covers/站名.png" style="width: 200px; height: auto; margin-top: 10px;" alt="clicli">
            </a>
        </div>
        <div>
            <img src="/uploads/covers/未登录.png" style="width: 65px; height: auto; margin-top: 5px; margin-right: 15px;" alt="未登录">
        </div>
    </div>

    <main class="back auth-panel" id="article">
        <h3 id="smallTitle">终于等到你(*╯3╰)</h3><br>
        <form method="post" action="/register" th:action="@{/register}">
            <div class="form-floating mb-3 login-input">
                <input type="text" name="nickname" class="form-control" id="nickname" placeholder="昵称" required>
                <label for="nickname">昵称</label>
            </div>
            <div class="form-floating mb-3 login-input">
                <input type="email" name="email" class="form-control" id="email" placeholder="slisli@example.com" required>
                <label for="email">邮箱: example@example.com</label>
            </div>
            <div class="form-floating login-input">
                <input type="password" name="password" class="form-control" id="password" placeholder="Password" required minlength="8" maxlength="16">
                <label for="password">密码：8-16位字母或数字</label>
            </div>
            <div th:if="${error != null}" class="error-message" th:text="${error}"></div>
            <br>
            <button type="submit" class="btn text-white pink-btn">注册</button>
            <p>已经有账号啦？</p>
            <a class="btn text-white pink-btn" href="/login" th:href="@{/login}">去登录</a>
        </form>
    </main>
</body>
</html>
