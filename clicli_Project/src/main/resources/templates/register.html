<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户注册</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:rgb(255, 228, 254);">
    <div class="back" id="top">
        <div id="siteName">
            <img src="/uploads/covers/站名.png" style="width: 200px; height: auto; margin-top: 10px;">
        </div>
        <div>
            <img src="/uploads/covers/未登录.png" style="width: 65px; height: auto; margin-top: 5px; margin-right: 15px;">
        </div>
    </div>
    
    <div class="back" id="article">
        <h3 id="smallTitle">终于等到你(*╯3╰)</h3><br>
        <form method="post" action="/register">
            <div class="form-floating mb-3 login-input">
                <input type="text" name="nickname" class="form-control" placeholder="昵称" required>
                <label>昵称</label>
            </div>
            <div class="form-floating mb-3 login-input">
                <input type="email" name="email" class="form-control" placeholder="邮箱" required>
                <label>邮箱</label>
            </div>
            <div class="form-floating login-input">
                <input type="password" name="password" class="form-control" placeholder="密码" required minlength="6">
                <label>密码（至少6位）</label>
            </div>
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <br>
            <button type="submit" class="btn text-white" style="background-color:#ff69b4;">注册</button>
        </form>
    </div>
</body>
</html>
