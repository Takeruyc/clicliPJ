<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>管理员登录</title>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="page-pink">
    <div class="back" id="top">
        <div id="siteName">
            <a href="/" th:href="@{/}">
                <img src="/uploads/covers/站名.png" style="width: 200px; height: auto; margin-top: 10px;" alt="clicli">
            </a>
        </div>
        <div>
            <img src="/uploads/covers/管理员.png" style="width: 65px; height: auto; margin-top: 5px; margin-right: 15px;" alt="管理员">
        </div>
    </div>

    <main class="back auth-panel" id="article">
        <h3 id="smallTitle">哇塞管理员sama(✧◡✧)</h3><br>
        <form method="post" action="/admin/login" th:action="@{/admin/login}">
            <div class="form-floating mb-3 login-input">
                <input type="text" class="form-control" id="adminId" name="adminId" placeholder="admin" required>
                <label for="adminId">管理员ID</label>
            </div>
            <div class="form-floating login-input">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <label for="password">密码：8-16位字母或数字</label>
            </div>
            <div class="error-message" th:if="${error != null}" th:text="${error}"></div>
            <br>
            <button type="submit" class="btn text-white pink-btn">登录</button>
        </form>
    </main>
</body>
</html>
